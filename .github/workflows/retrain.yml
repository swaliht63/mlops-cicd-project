name: Model Retraining

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  retrain-validate-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-training.txt

      - name: Install training and test dependencies
        run: python -m pip install -r requirements-training.txt

      - name: Train candidate model
        run: python -m src.train

      - name: Compare candidate with approved baseline
        run: python -m src.validate_candidate

      - name: Run tests and quality checks
        run: python -m pytest -q

      - name: Save validated model
        uses: actions/upload-artifact@v4
        with:
          name: validated-model
          path: artifacts/model.joblib
          if-no-files-found: error
          retention-days: 30

      - name: Save MLflow tracking database
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking-database
          path: mlflow.db
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name and model version
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          MODEL_VERSION=$(python -c "import joblib; print(joblib.load('artifacts/model.joblib')['model_version'])")
          echo "MODEL_VERSION=$MODEL_VERSION" >> "$GITHUB_ENV"

      - name: Build and publish model image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:model-${{ env.MODEL_VERSION }}
            ${{ env.IMAGE_NAME }}:run-${{ github.run_id }}
